<!DOCTYPE html>
<html lang="pt">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="./icon/localizacao.png" type="image/x-icon">
  <link rel="stylesheet" href="./style.css">
  <title>Busque CEP</title>
</head>
<body>
        
  <div id="painel-box">
    <h1>Busque CEP</h1>
    <header>
      <div>
        <h2>Busque seu CEP de maneira rápida e fácil</h2>
      </div>
    </header>
      <div class="box-search">
        <div class="input-and-button">
          <input id="cep" type="text" autofocus  placeholder="Digite seu cep" required>
          <button onclick="buscarCep()">Buscar</button>
        </div>
        <div class="result">
          <p id="resultado"></p>
        </div>
      </div>
  </div>
  <script src="./script.js"></script>
</body>
</html>
